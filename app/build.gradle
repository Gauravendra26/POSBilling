plugins {
    id 'com.android.application' version '8.0.0'
    id 'org.jetbrains.kotlin.android' version '1.9.0'
}

android {
    compileSdk 34
    namespace "de.syss.MifareClassicTool"

    defaultConfig {
        applicationId "de.syss.MifareClassicTool"
        minSdk 21
        targetSdk 33
        versionCode 65
        versionName '4.2.0'
    }


    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs << "-Xlint:unchecked" << "-Xlint:deprecation"
}

dependencies {
    implementation "androidx.core:core:1.10.1"
    implementation "androidx.preference:preference:1.2.1"
    implementation "androidx.appcompat:appcompat:1.6.1"
    implementation 'com.intuit.ssp:ssp-android:1.0.6'
    implementation 'com.intuit.sdp:sdp-android:1.0.6'
    implementation 'androidx.cardview:cardview:1.0.0'
//    implementation files('C:\\Users\\chara\\Downloads\\MifareClassicTool-master (1)\\MifareClassicTool-master\\Mifare Classic Tool\\app\\libs\\jtds-1.3.1.jar')
    implementation fileTree(include: ['*.jar'], dir: 'libs')

    implementation 'com.google.android.material:material:1.5.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    implementation 'androidx.room:room-ktx:2.2.4'

    implementation "androidx.room:room-runtime:2.4.0"
    annotationProcessor "androidx.room:room-compiler:2.4.0"
    def lottieVersion = "3.4.0"
    implementation "com.airbnb.android:lottie:$lottieVersion"
    implementation 'com.google.code.gson:gson:2.8.9' // Use the latest version available

}
